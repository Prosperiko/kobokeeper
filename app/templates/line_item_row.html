<tr>
  <td><input type="text" name="item_name" value="{{ item.name or '' }}" /></td>
  <td><input type="number" step="0.01" name="item_qty" value="{{ item.qty if item.qty is not none else 1 }}" /></td>
  <td><input type="number" step="0.01" name="item_unit_price" value="{{ item.unit_price if item.unit_price is not none else '' }}" /></td>
  <td><input type="number" step="0.01" name="item_amount" value="{{ item.amount if item.amount is not none else '' }}" /></td>
</tr>
